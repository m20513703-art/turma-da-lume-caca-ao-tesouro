<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#183c31"><title>Turma da Lume — Caça ao Tesouro</title>
<style>
:root{--ink:#244237;--leaf:#28744d;--sun:#ffd85a;--cream:#fff9e8;--pink:#ff8f9d}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#183c31,#397854);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);min-height:100vh}.app{max-width:1160px;margin:auto;padding:16px}.top{display:flex;align-items:center;justify-content:space-between;color:#fff;gap:10px;margin:0 0 12px}.brand{font-size:clamp(1.2rem,3vw,2rem);font-weight:900;text-shadow:0 2px 0 #16362d}.badge{background:#ffffff24;border:1px solid #ffffff55;border-radius:99px;padding:8px 14px;font-weight:800}.panel{background:var(--cream);border:4px solid #fff;border-radius:24px;box-shadow:0 12px 28px #102d2766;padding:clamp(14px,2.6vw,24px)}h1,h2,p{margin:0}h1{font-size:clamp(1.4rem,3vw,2.15rem)}.lead{margin:5px 0 14px;color:#597062}.characters{display:grid;grid-template-columns:repeat(8,minmax(80px,1fr));gap:8px}.character{border:2px solid #e6e3d2;background:white;border-radius:16px;padding:9px 4px;cursor:pointer;text-align:center;color:var(--ink);font:inherit;transition:.15s}.character:hover{transform:translateY(-3px);border-color:#74b184}.character.selected{background:#e7f6d8;border-color:#399457;box-shadow:0 0 0 2px #39945755}.face{display:block;font-size:30px;line-height:1.1}.cname{font-size:13px;font-weight:850;display:block}.help{font-size:10px;line-height:1.2;color:#647a6b;display:block;margin-top:3px}.start{display:block;margin:15px auto 0;border:0;border-radius:999px;padding:12px 27px;background:var(--sun);color:#4b3c11;font:inherit;font-weight:900;font-size:17px;box-shadow:0 4px #d5ab31;cursor:pointer}.start:disabled{opacity:.5;cursor:default}.game{display:none}.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}.status{font-weight:850;font-size:17px}.meter{height:13px;background:#e4e4d5;border-radius:20px;overflow:hidden;flex:1;min-width:110px}.fill{height:100%;width:0;background:linear-gradient(90deg,#76c854,#f4ce42);transition:width .25s}.scene{position:relative;overflow:hidden;border-radius:18px;border:4px solid white;background:#315e40;touch-action:manipulation}.scene img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,7vw,76px);height:clamp(40px,7vw,76px);border:0;border-radius:50%;background:transparent;cursor:pointer;outline:none}.spot:hover,.spot:focus-visible{background:#ffe87544;box-shadow:0 0 0 3px #fff8,0 0 18px #ffdf50}.spot.found{display:none}.scene .sprite{display:block;position:absolute;pointer-events:none;height:auto}.scene .sprite.found{display:none}.coin-badge{background:#fff0ae;border-radius:99px;padding:6px 11px;font-weight:900;color:#705414}.item.found{display:none}.hint:disabled{opacity:.55;cursor:not-allowed}@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6)}65%{transform:translate(-50%,-50%) scale(1.2)}100%{transform:translate(-50%,-50%) scale(1)}}.lower{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-top:12px}.items{display:flex;gap:6px;flex-wrap:wrap}.item{background:#fff;border:2px solid #e6e3d2;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:750;color:#778579}.item.found{background:#e4f5d5;color:#2b7042;border-color:#96c981;text-decoration:line-through}.hint{border:0;background:#e8f0dc;border-radius:14px;padding:10px 14px;font:inherit;font-weight:850;color:#355740;cursor:pointer}.hint:active{transform:scale(.97)}.message{min-height:25px;font-weight:800;text-align:center;color:#32704a;margin-top:9px}.next{display:none;margin:8px auto 0}.footer{text-align:center;color:#e9f1e9;font-size:12px;margin:12px}.pill{font-size:12px;color:#526d59}.celebrate{font-size:24px;display:block;margin-bottom:5px}@media(max-width:700px){.characters{grid-template-columns:repeat(4,1fr)}.app{padding:10px}.panel{border-radius:20px}.lower{grid-template-columns:1fr}.hint{justify-self:center}.top{margin-bottom:8px}.cname{font-size:12px}.help{font-size:9px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand">✨ Turma da Lume</div><div class="badge">🌿 Caça ao Tesouro</div></header>
<section class="panel" id="choose"><h1>Quem vai explorar a floresta?</h1><p class="lead">Escolha um personagem para ajudar a encontrar 10 tesouros escondidos!</p><div class="characters" id="characters"></div><button class="start" id="start" disabled>Começar a fase 1 🌟</button></section>
<section class="panel game" id="game"><div class="hud"><div class="status">Fase <span id="level">1</span> · <span id="count">0</span>/10 encontrados</div><div class="meter"><div class="fill" id="fill"></div></div><div class="coin-badge">🪙 <span id="coins">0</span> moedas</div><div class="pill" id="chosen"></div></div><div class="scene" id="scene"><img src="floresta-limpa.webp" alt="Clareira ilustrada com riacho, árvores e esconderijos na floresta"><button class="spot" aria-label="Procurar item escondido" data-id="0" style="left:18%;top:82%"></button><button class="spot" aria-label="Procurar item escondido" data-id="1" style="left:28%;top:22%"></button><button class="spot" aria-label="Procurar item escondido" data-id="2" style="left:23%;top:47%"></button><button class="spot" aria-label="Procurar item escondido" data-id="3" style="left:44%;top:47%"></button><button class="spot" aria-label="Procurar item escondido" data-id="4" style="left:53%;top:76%"></button><button class="spot" aria-label="Procurar item escondido" data-id="5" style="left:59%;top:54%"></button><button class="spot" aria-label="Procurar item escondido" data-id="6" style="left:79%;top:56%"></button><button class="spot" aria-label="Procurar item escondido" data-id="7" style="left:72%;top:57%"></button><button class="spot" aria-label="Procurar item escondido" data-id="8" style="left:88%;top:31%"></button><button class="spot" aria-label="Procurar item escondido" data-id="9" style="left:93%;top:67%"></button></div><div class="lower"><div class="items" id="items"></div><button class="hint" id="hint">💡 Dica · 3 moedas (2/2)</button></div><div class="message" id="message" aria-live="polite"></div><button class="start next" id="next">Próxima fase ➜</button></section><div class="footer">Procure com atenção — os tesouros estão escondidos entre as árvores! 🍄</div></main>
<script>
const cast=[['✨','Lume','Vaga-lume'],['🦊','Nina','Raposa'],['🐰','Tico','Coelho'],['🐊','Tom','Jacaré'],['🐻','Mike','Urso'],['🦉','Mari','Coruja'],['🐢','Cadu','Tartaruga'],['🦒','Mika','Girafa']];
const treasures=['🍎 Maçã vermelha','🪶 Pena azul','🗝️ Chave dourada','🍄 Cogumelo pintado','💎 Pedra brilhante','⭐ Broche de estrela','🐇 Coelhinho de madeira','🍃 Apito de folha','🦋 Borboleta rosa','🎒 Mochila laranja'];const SAVE_KEY='turma_lume_caca_v2';let selected=-1,found=new Set(),level=1,coins=0,hintsUsed=0;
try{const save=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(save&&Array.isArray(save.found)){found=new Set(save.found.filter(i=>Number.isInteger(i)&&i>=0&&i<10));coins=Math.max(0,Number(save.coins)||0);hintsUsed=Math.min(2,Math.max(0,Number(save.hintsUsed)||0));}}catch(e){}
function saveProgress(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({found:[...found],coins,hintsUsed}))}catch(e){}}
const spriteBoxes=[[15.29,79.02,5.64],[24.78,18.08,6.70],[19.31,43.38,8.20],[42.30,44.49,4.52],[51.12,72.92,3.79],[56.98,51.12,4.24],[77.12,50.97,4.85],[69.98,52.60,4.41],[83.43,24.18,8.76],[90.18,62.72,7.03]];
spriteBoxes.forEach(([x,y,w],i)=>{const img=document.createElement('img');img.className='sprite';img.id='sprite'+i;img.alt='';img.src='objeto-'+i+'.webp';img.style.cssText=`left:${x}%;top:${y}%;width:${w}%`;document.getElementById('scene').appendChild(img)});
function updateHud(){document.getElementById('count').textContent=found.size;document.getElementById('fill').style.width=(found.size*10)+'%';document.getElementById('coins').textContent=coins;const h=document.getElementById('hint');h.textContent='💡 Dica · 3 moedas ('+(2-hintsUsed)+'/2)';h.disabled=hintsUsed>=2||found.size===10;document.querySelectorAll('.spot').forEach(s=>{const id=+s.dataset.id;s.classList.toggle('found',found.has(id));document.getElementById('sprite'+id).classList.toggle('found',found.has(id));document.getElementById('item'+id).classList.toggle('found',found.has(id))});if(found.size===10){document.getElementById('message').innerHTML='<span class="celebrate">🎉🌟🎉</span>Você encontrou os 10 tesouros! Que aventura incrível!';document.getElementById('next').style.display='block'}}
const chars=document.getElementById('characters');cast.forEach((c,i)=>{const b=document.createElement('button');b.className='character';b.innerHTML=`<span class="face">${c[0]}</span><span class="cname">${c[1]}</span><span class="help">${c[2]}</span>`;b.onclick=()=>{selected=i;document.querySelectorAll('.character').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('start').disabled=false};chars.appendChild(b)});
const itemBox=document.getElementById('items');function setupItems(){itemBox.innerHTML='';treasures.forEach((x,i)=>{const e=document.createElement('span');e.className='item';e.id='item'+i;e.textContent=x;itemBox.appendChild(e)})}setupItems();
document.getElementById('start').onclick=()=>{document.getElementById('choose').style.display='none';document.getElementById('game').style.display='block';document.getElementById('chosen').textContent=cast[selected][0]+' '+cast[selected][1];};
updateHud();
document.querySelectorAll('.spot').forEach(s=>s.onclick=()=>{const id=+s.dataset.id;if(found.has(id))return;found.add(id);coins++;saveProgress();document.getElementById('message').textContent='Você encontrou '+treasures[id]+' e ganhou 1 moeda! 🪙';updateHud()});
document.getElementById('hint').onclick=()=>{if(hintsUsed>=2||found.size===10)return;if(coins<3){document.getElementById('message').textContent='Você precisa de 3 moedas para comprar uma dica. Encontre mais tesouros!';return}const left=[...document.querySelectorAll('.spot:not(.found)')];if(!left.length)return;const target=left[Math.floor(Math.random()*left.length)];coins-=3;hintsUsed++;saveProgress();updateHud();target.focus({preventScroll:true});target.animate([{boxShadow:'0 0 0 0 #ffe875'},{boxShadow:'0 0 0 18px #ffe875ee'},{boxShadow:'0 0 0 0 #ffe875'}],{duration:1000,iterations:3});document.getElementById('message').textContent='Dica comprada! Olhe perto do brilho ✨'};
document.getElementById('next').onclick=()=>{document.getElementById('message').textContent='Essa prévia mostra a fase 1. Mais fases e cenários entram nas próximas etapas do jogo!';document.getElementById('next').style.display='none'};
</script></body></html>
